name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: ['*']

jobs:
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Renders as "E2E / E2E tests (default)", "E2E tests (+JCollab)",
        # "E2E tests (+JSD)". Each variant maps to a nox session that installs
        # the matching transport into an isolated venv.
        variant: [default, +JCollab, +JSD]

    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Base Setup
        uses: jupyterlab/maintainer-tools/.github/actions/base-setup@v1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install nox
        run: uv tool install nox

      - name: Restore browser cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/pw-browsers
          key: ${{ runner.os }}-${{ hashFiles('ui-tests/yarn.lock', 'ui-tests/package.json') }}

      # Transport-independent, so it runs once at the job level: jlpm needs a
      # bootstrap jupyterlab, and `playwright install-deps` needs sudo (not
      # available inside a nox venv). nox reuses this node_modules + browser
      # cache; the per-transport server deps are installed by nox next.
      - name: Set up ui-tests deps + browser
        working-directory: ui-tests
        env:
          YARN_ENABLE_IMMUTABLE_INSTALLS: 0
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          set -eux
          python -m pip install "jupyterlab>=4.0.0,<5"
          jlpm install
          jlpm playwright install-deps
          jlpm playwright install chromium

      - name: Run E2E tests (${{ matrix.variant }})
        run: |
          set -eux
          case "${{ matrix.variant }}" in
            default)  SESSION="e2e(env='default')" ;;
            +JCollab) SESSION="e2e(env='jcollab')" ;;
            +JSD)     SESSION="e2e(env='jsd')" ;;
            *) echo "unknown variant: ${{ matrix.variant }}" >&2; exit 1 ;;
          esac
          nox -s "$SESSION"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jupyter-ai-tools-playwright-${{ matrix.variant }}
          path: |
            ui-tests/test-results
            ui-tests/playwright-report
